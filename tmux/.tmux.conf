# Cambiar el prefijo de Ctrl+b a Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

set -g mouse on

# Moverse entre paneles con teclas de movimiento de Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar paneles con Ctrl + prefijo + flechas
bind -r H resize-pane -L 5
bind -r J resize-pane -D 6
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Usar prefijo + m para maximizar/minimizar el panel
bind m resize-pane -Z

# Mejorar los colores de la barra de estado
set -g status-bg black
set -g status-fg white
set -g status-left-length 20
set -g status-left '#[fg=green][#S] '
set -g status-right '#[fg=yellow]%H:%M #[fg=white]%d-%b-%y'

# Usar teclas de Vim en el modo copia para moverte por el historial
setw -g mode-keys vi

# Configurar v para seleccionar y y para copiar (como en LazyVim)
bind-key -T copy-mode-vi v send-key -X begin-selection
bind-key -T copy-mode-vi y send-key -X copy-selection-and-cancel

######################################################
#Plugins

set -g @plugin 'Nybkox/tmux-kanagawa'

# Theme customization
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-plugins "git cpu-usage ram-usage"
set -g @kanagawa-ignore-window-colors true

run '~/.tmux/plugins/tpm/tpm'
